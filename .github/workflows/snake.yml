name: Contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#9c7a1e&color_dots=#ebe4d4,#d9c9a0,#c4a85a,#9c7a1e,#5a3d2b
            dist/snake-dark.svg?color_snake=#d08b5b&color_dots=#29211b,#4a3a2c,#7a5a40,#b07850,#d08b5b

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
